{% extends "global/base.html" %}
{% block content %}
  <h1>{{form_title}}</h1>
  <div class="form-wrapper">

    <h2>{{form_title}}</h2>

    {% if not user.is_authenticated %}
        {% include "user/partials/_user_form.html" %}
    {% else %}
        <p>Você fez login como {{user.username}}. <a class="menu-link:hover" href="{% url "contact:user_logout" %}">Clique aqui </a> para fazer logout</p>
    {% endif %}
    
  </div>
{% endblock content %}
